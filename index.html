<style>

.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 26px #0002}.sheet h2{margin:0 0 10px}.sheet p{color:var(--muted);font-size:13px}.sheet button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:9px;font-weight:850}.secondary{background:#efeff4}.same-round{background:var(--accent);color:#fff}.danger{background:#ffe8e6;color:var(--danger)}.results{display:grid;gap:6px;margin:12px 0}.result-row{display:flex;justify-content:space-between;background:#f4f4f7;border-radius:10px;padding:10px;font-weight:850}.result-row strong{color:var(--accent)}.view-scores{background:#e5f4f5;color:var(--accent)}.menu-result{display:none;background:#e5f4f5;color:var(--accent)}.history-meta{font-size:12px;color:var(--muted);margin:-4px 0 10px}.history-table-wrap{overflow:auto;border-radius:13px}.history-table{border-radius:13px}.history-table .cat-col{width:55%}.history-missing{padding:18px 8px;color:var(--muted);text-align:center;font-size:13px}
@media(max-width:360px){.cat-col{width:36%;font-size:11px}.player-head.current{font-size:14px}.score-cell{font-size:12px}.die{font-size:clamp(56px,17vw,88px)}}@media(min-width:700px) and (min-height:650px){.game{max-width:900px}.score-wrap{padding:8px 18px 0}.score-wrap>table{height:100%;border-radius:14px}.score-wrap>table th,.score-wrap>table td{height:auto}.cat-col{font-size:15px}.player-head{font-size:15px}.player-head.current{font-size:20px}.score-cell{font-size:16px}.section-row .cat-col,.section-row td{font-size:12px}.summary-row .cat-col,.summary-row td{font-size:14px}.grand-row .cat-col,.grand-row td{font-size:16px}.control-dock{padding-left:18px;padding-right:18px}.dice-row,.dock-actions,.hint{max-width:840px;margin-left:auto;margin-right:auto}.dock-actions{margin-top:8px}.hint{font-size:13px;margin-top:5px}}@media(prefers-reduced-motion:reduce){.die.rolling{animation:none}}

<body>
<section id="startScreen" class="screen active"><div class="start-wrap"><div class="start-card"><div class="logo">🎲</div><h1>Kniffel</h1><div class="subtitle">1 bis 4 Spieler</div><div class="label">Anzahl Spieler</div><div class="player-count"><button class="count-btn" data-count="1">1</button><button class="count-btn" data-count="2">2</button><button class="count-btn selected" data-count="3">3</button><button class="count-btn" data-count="4">4</button></div><div class="label">Spielernamen</div><div id="nameInputs" class="names"></div><button id="startGameBtn" class="primary">Spiel starten</button><div class="highscores"><h2>🏆 Highscores</h2><div id="highscoreList" class="highscore-list"></div></div></div></div></section>
<section id="gameScreen" class="screen"><div class="game"><div class="score-wrap"><table id="scoreTable"></table></div><div class="control-dock"><div id="diceRow" class="dice-row"></div><div class="dock-actions"><button id="menuBtn" class="menu-btn">⋯</button><button id="confirmBtn" class="confirm-btn" disabled>Eintragen &amp;<br>weiter</button><button id="rollBtn" class="roll-btn">Würfeln</button></div><div id="hint" class="hint"></div></div></div></section>
<div id="menuModal" class="modal"><div class="sheet"><h2>Spiel</h2><button id="closeMenuBtn" class="secondary">Weiter spielen</button><button id="showResultBtn" class="menu-result">Rundenergebnis anzeigen</button><button id="newGameBtn" class="danger">Spiel beenden / Namen ändern</button></div></div>
<div id="endModal" class="modal"><div class="sheet"><h2>🎉 Runde beendet</h2><div id="results" class="results"></div><button id="viewScoresBtn" class="view-scores">Punkte ansehen</button><button id="samePlayersBtn" class="same-round">Neue Runde – gleiche Namen</button><button id="changePlayersBtn" class="secondary">Neue Runde – Namen ändern</button></div></div>
<div id="historyModal" class="modal"><div class="sheet"><h2 id="historyTitle">Highscore</h2><div id="historyMeta" class="history-meta"></div><div id="historyContent"></div><button id="closeHistoryBtn" class="secondary">Schließen</button></div></div>
<script>
(()=>{const cats=[{id:'ones',label:'Einser',sec:'u'},{id:'twos',label:'Zweier',sec:'u'},{id:'threes',label:'Dreier',sec:'u'},{id:'fours',label:'Vierer',sec:'u'},{id:'fives',label:'Fünfer',sec:'u'},{id:'sixes',label:'Sechser',sec:'u'},{id:'threeKind',label:'Dreierpasch',sec:'l'},{id:'fourKind',label:'Viererpasch',sec:'l'},{id:'fullHouse',label:'Full House',sec:'l'},{id:'smallStraight',label:'Kl. Straße',sec:'l'},{id:'largeStraight',label:'Gr. Straße',sec:'l'},{id:'kniffel',label:'Kniffel',sec:'l'},{id:'chance',label:'Chance',sec:'l'}];let pc=3,players=[],scores=[],cur=0,dice=[1,1,1,1,1],held=[false,false,false,false,false],rolls=0,sel=null,selVal=null,isRolling=false,rollingMask=[false,false,false,false,false],audioCtx=null,roundFinished=false,visibleHighscores=[];
const $=id=>document.getElementById(id),start=$('startScreen'),game=$('gameScreen'),names=$('nameInputs'),diceRow=$('diceRow'),rollBtn=$('rollBtn'),hint=$('hint'),table=$('scoreTable'),confirmBtn=$('confirmBtn'),modal=$('menuModal'),endModal=$('endModal'),results=$('results'),highscoreList=$('highscoreList'),historyModal=$('historyModal'),historyTitle=$('historyTitle'),historyMeta=$('historyMeta'),historyContent=$('historyContent'),showResultBtn=$('showResultBtn');
function getAudio(){try{if(!audioCtx||audioCtx.state==='closed')audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}catch(e){return null}}async function wakeAudio(){let a=getAudio();if(!a)return null;try{if(a.state!=='running')await a.resume()}catch(e){try{audioCtx=null;a=getAudio();if(a&&a.state!=='running')await a.resume()}catch(e2){}}return a}function clickSound(){wakeAudio().then(a=>{if(!a||a.state!=='running')return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(650,t);o.frequency.exponentialRampToValueAtTime(300,t+.045);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.055)})}function rollSound(){wakeAudio().then(a=>{if(!a||a.state!=='running')return;let l=Math.floor(a.sampleRate*.035),b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*(1-i/l);let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=500+Math.random()*1000;g.gain.value=.065;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()})}document.addEventListener('pointerdown',()=>wakeAudio(),{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)wakeAudio()});window.addEventListener('pageshow',()=>wakeAudio());window.addEventListener('focus',()=>wakeAudio());
function renderNames(prefill=[]){names.innerHTML='';for(let i=0;i<pc;i++){let x=document.createElement('input'),def=`Spieler ${i+1}`;x.value=prefill[i]||def;x.maxLength=14;x.addEventListener('focus',()=>{if(x.value===def)x.value=''});x.addEventListener('blur',()=>{if(!x.value.trim())x.value=def});names.appendChild(x)}}document.querySelectorAll('.count-btn').forEach(b=>b.onclick=()=>{pc=+b.dataset.count;document.querySelectorAll('.count-btn').forEach(x=>x.classList.toggle('selected',x===b));renderNames()});renderNames();
function getHighscores(){try{return JSON.parse(localStorage.getItem('kniffelHighscores')||'[]')}catch(e){return[]}}function renderHighscores(){visibleHighscores=getHighscores().slice(0,10);highscoreList.innerHTML=visibleHighscores.length?visibleHighscores.map((h,i)=>`<button class="highscore-row" data-hi="${i}"><span class="highscore-rank">${i+1}.</span><span class="highscore-name">${esc(h.name)}</span><span class="highscore-score">${h.score}</span><span class="highscore-date">${esc(h.date)} · ${esc(h.time)}</span></button>`).join(''):'<div style="font-size:12px;color:#888">Noch keine Highscores.</div>';highscoreList.querySelectorAll('[data-hi]').forEach(b=>b.onclick=()=>showHighscore(visibleHighscores[+b.dataset.hi]))}function saveHighscores(){let now=new Date(),date=now.toLocaleDateString('de-DE'),time=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),hs=getHighscores(),stamp=Date.now();players.forEach((p,i)=>hs.push({name:p,score:total(i),date,time,stamp:stamp+i,breakdown:{...scores[i]}}));hs.sort((a,b)=>b.score-a.score||b.stamp-a.stamp);localStorage.setItem('kniffelHighscores',JSON.stringify(hs.slice(0,50)));renderHighscores()}function upperFrom(s){return['ones','twos','threes','fours','fives','sixes'].reduce((a,id)=>a+(s[id]??0),0)}function lowerFrom(s){return['threeKind','fourKind','fullHouse','smallStraight','largeStraight','kniffel','chance'].reduce((a,id)=>a+(s[id]??0),0)}function showHighscore(h){historyTitle.textContent=`🏆 ${h.name} – ${h.score} Punkte`;historyMeta.textContent=`${h.date} · ${h.time}`;if(!h.breakdown){historyContent.innerHTML='<div class="history-missing">Für diesen älteren Highscore wurden noch keine Einzelergebnisse gespeichert.</div>'}else{let s=h.breakdown,u=upperFrom(s),b=u>=63?35:0,t=u+b+lowerFrom(s),html='<div class="history-table-wrap"><table class="history-table"><thead><tr><th class="cat-col">Kategorie</th><th>'+esc(h.name)+'</th></tr></thead><tbody><tr class="section-row"><th class="cat-col">Oberer Block</th><td></td></tr>';cats.filter(c=>c.sec==='u').forEach(c=>html+=`<tr><th class="cat-col">${c.label}</th><td class="score-cell">${s[c.id]??0}</td></tr>`);html+=`<tr class="summary-row"><th class="cat-col">Zwischensumme</th><td>${u}</td></tr><tr class="summary-row"><th class="cat-col">Bonus ab 63</th><td class="${b===35?'bonus-earned':''}">${b}</td></tr><tr class="section-row"><th class="cat-col">Unterer Block</th><td></td></tr>`;cats.filter(c=>c.sec==='l').forEach(c=>html+=`<tr><th class="cat-col">${c.label}</th><td class="score-cell">${s[c.id]??0}</td></tr>`);html+=`<tr class="grand-row"><th class="cat-col">Gesamt</th><td>${t}</td></tr></tbody></table></div>`;historyContent.innerHTML=html}historyModal.classList.add('open')}renderHighscores();
$('startGameBtn').onclick=()=>{wakeAudio();players=[...names.querySelectorAll('input')].map((x,i)=>x.value.trim()||`Spieler ${i+1}`);startRound();start.classList.remove('active');game.classList.add('active')};function startRound(){scores=players.map(()=>Object.fromEntries(cats.map(c=>[c.id,null])));cur=0;roundFinished=false;resetTurn();renderAll();requestAnimationFrame(()=>document.querySelector('.score-wrap').scrollTop=0)}
function cnt(){let c=[0,0,0,0,0,0,0];dice.forEach(v=>c[v]++);return c}function sum(){return dice.reduce((a,b)=>a+b,0)}function small(){let s=[...new Set(dice)].sort().join('');return s.includes('1234')||s.includes('2345')||s.includes('3456')}function large(){let s=[...new Set(dice)].sort().join('');return s==='12345'||s==='23456'}function val(id){let c=cnt(),s=sum();switch(id){case'ones':return c[1];case'twos':return c[2]*2;case'threes':return c[3]*3;case'fours':return c[4]*4;case'fives':return c[5]*5;case'sixes':return c[6]*6;case'threeKind':return c.some(n=>n>=3)?s:0;case'fourKind':return c.some(n=>n>=4)?s:0;case'fullHouse':return c.includes(3)&&c.includes(2)?25:0;case'smallStraight':return small()?30:0;case'largeStraight':return large()?40:0;case'kniffel':return c.includes(5)?50:0;case'chance':return s}}
function upper(i){return upperFrom(scores[i])}function bonus(i){return upper(i)>=63?35:0}function lower(i){return lowerFrom(scores[i])}function total(i){return upper(i)+bonus(i)+lower(i)}function fairDie(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=4294967292;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%6+1}return Math.floor(Math.random()*6)+1}
function renderDice(){diceRow.innerHTML='';dice.forEach((v,i)=>{let d=document.createElement('div');d.className='die'+(held[i]?' held':'')+(rolls===0&&!isRolling?' disabled':'')+(rollingMask[i]?' rolling':'');d.textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][v];d.onclick=()=>{if(isRolling||roundFinished||rolls===0||rolls>=3)return;held[i]=!held[i];clickSound();renderDice()};diceRow.appendChild(d)})}function renderTop(){if(roundFinished){hint.textContent='Runde beendet · Ergebnis über ⋯ wieder öffnen.';rollBtn.textContent='Runde beendet'}else if(isRolling){hint.textContent='Würfel rollen …';rollBtn.textContent='Würfelt …'}else if(rolls===0){hint.textContent=`${players[cur]} · Wurf 0 / 3`;rollBtn.textContent='Würfeln'}else if(rolls<3){hint.textContent=`${players[cur]} · Wurf ${rolls} / 3 · Würfel antippen = behalten.`;rollBtn.textContent=`Würfeln (${3-rolls} übrig)`}else{hint.textContent=`${players[cur]} · Wurf 3 / 3 · Kategorie wählen.`;rollBtn.textContent='Keine Würfe mehr'}rollBtn.disabled=roundFinished||isRolling||rolls>=3;rollBtn.style.opacity=rollBtn.disabled?'.5':'1';confirmBtn.disabled=roundFinished||isRolling||sel===null||rolls===0}
function row(c){let r=`<tr><th class="cat-col">${c.label}</th>`;players.forEach((_,i)=>{let old=scores[i][c.id],isCur=i===cur,cc=isCur?' current-col':'';if(old!==null)r+=`<td class="score-cell${cc}">${old}</td>`;else if(isCur&&rolls>0&&!roundFinished){let v=val(c.id);r+=`<td class="score-cell suggestion current-col ${v===0?'zero':''} ${sel===c.id?'selected':''}" data-cat="${c.id}" data-val="${v}">${v}</td>`}else r+=`<td class="score-cell${cc}">–</td>`});return r+'</tr>'}function summary(l,f,g=false,bonusRow=false){let r=`<tr class="${g?'grand-row':'summary-row'}"><th class="cat-col">${l}</th>`;players.forEach((_,i)=>{let v=f(i),cls=(bonusRow&&v===35?' bonus-earned':'')+(i===cur?' current-col':'');r+=`<td class="${cls.trim()}">${v}</td>`});return r+'</tr>'}
function renderTable(){let h='<thead><tr><th class="cat-col">Kategorie</th>';players.forEach((p,i)=>h+=`<th class="player-head ${i===cur?'current':''}">${esc(p)}</th>`);h+='</tr></thead><tbody><tr class="section-row"><th class="cat-col">Oberer Block</th>'+players.map((_,i)=>`<td class="${i===cur?'current-col':''}"></td>`).join('')+'</tr>';cats.filter(c=>c.sec==='u').forEach(c=>h+=row(c));h+=summary('Zwischensumme',upper)+summary('Bonus ab 63',bonus,false,true)+'<tr class="section-row"><th class="cat-col">Unterer Block</th>'+players.map((_,i)=>`<td class="${i===cur?'current-col':''}"></td>`).join('')+'</tr>';cats.filter(c=>c.sec==='l').forEach(c=>h+=row(c));h+=summary('Gesamt',total,true)+'</tbody>';table.innerHTML=h;table.querySelectorAll('.suggestion').forEach(td=>td.onclick=()=>{if(isRolling||roundFinished)return;sel=td.dataset.cat;selVal=+td.dataset.val;clickSound();renderTable();renderTop()})}
function renderAll(){renderDice();renderTop();renderTable()}function finishRoll(finalDice){dice=finalDice;rolls++;sel=null;selVal=null;isRolling=false;rollingMask=[false,false,false,false,false];renderAll()}rollBtn.onclick=()=>{if(roundFinished||isRolling||rolls>=3)return;wakeAudio();isRolling=true;sel=null;selVal=null;rollingMask=held.map(h=>!h);const finalDice=dice.map((v,i)=>held[i]?v:fairDie());renderTop();renderDice();renderTable();rollSound();const t=performance.now(),ticker=setInterval(()=>{dice=dice.map((v,i)=>rollingMask[i]?fairDie():v);rollSound();renderDice();if(performance.now()-t>=620){clearInterval(ticker);finishRoll(finalDice);clickSound()}},90)};
function openEndModal(){results.innerHTML=players.map((p,i)=>`<div class="result-row"><span>${esc(p)}</span><strong>${total(i)} Punkte</strong></div>`).join('');endModal.classList.add('open')}confirmBtn.onclick=()=>{if(roundFinished||isRolling||sel===null||rolls===0)return;clickSound();scores[cur][sel]=selVal;if(scores.every(p=>cats.every(c=>p[c.id]!==null))){roundFinished=true;renderAll();saveHighscores();openEndModal();return}cur=(cur+1)%players.length;resetTurn();renderAll();document.querySelector('.score-wrap').scrollTop=0};
function resetTurn(){dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=0;sel=null;selVal=null;isRolling=false;rollingMask=[false,false,false,false,false]}$('menuBtn').onclick=()=>{showResultBtn.style.display=roundFinished?'block':'none';modal.classList.add('open')};$('closeMenuBtn').onclick=()=>modal.classList.remove('open');showResultBtn.onclick=()=>{modal.classList.remove('open');openEndModal()};$('viewScoresBtn').onclick=()=>endModal.classList.remove('open');$('newGameBtn').onclick=()=>{if(confirm('Aktuelles Spiel beenden?')){modal.classList.remove('open');game.classList.remove('active');start.classList.add('active');pc=players.length;renderNames(players);renderHighscores()}};$('samePlayersBtn').onclick=()=>{endModal.classList.remove('open');startRound()};$('changePlayersBtn').onclick=()=>{endModal.classList.remove('open');game.classList.remove('active');start.classList.add('active');pc=players.length;renderNames(players);renderHighscores()};$('closeHistoryBtn').onclick=()=>historyModal.classList.remove('open');[modal,historyModal].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
})();
