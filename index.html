<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Kniffel</title>
<style>
:root{--bg:#f4f4f7;--text:#111;--muted:#6d6d72;--line:#d9d9df;--accent:#0b8993;--accentSoft:#e3f4f5;--good:#198754;--danger:#c9362b;--dock:#f4f4f7f7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}button,input{font:inherit}.screen{display:none;min-height:100vh}.screen.active{display:block}
.start-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.start-card{width:min(460px,100%);background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 2px 10px #0001;text-align:center}.logo{font-size:54px}.start-card h1{margin:6px 0 4px;font-size:34px}.subtitle{color:var(--muted);margin-bottom:24px}.label{text-align:left;font-size:14px;color:var(--muted);font-weight:800;margin:16px 0 8px}.player-count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.count-btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 0;font-size:19px;font-weight:900}.count-btn.selected{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}.names{display:grid;gap:10px}.names input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:17px}.primary{width:100%;margin-top:20px;border:0;border-radius:15px;padding:16px;background:var(--accent);color:#fff;font-weight:900;font-size:19px}
#gameScreen.active{height:100vh;height:100dvh;overflow:hidden}.game{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.game-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 10px 2px;background:var(--bg);border-bottom:1px solid var(--line)}.turn-label{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase;line-height:1}.turn-name{font-size:17px;font-weight:950;line-height:1.05;margin-top:1px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roll-status{font-size:12px;color:var(--muted);white-space:nowrap}.score-wrap{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:2px 5px 151px;scrollbar-width:none}.score-wrap::-webkit-scrollbar{display:none}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:0 1px 5px #0001}thead th{position:sticky;top:0;z-index:5}th,td{height:33px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;overflow:hidden}tr:last-child th,tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.cat-col{width:34%;text-align:left;padding:0 6px;font-size:12px;font-weight:900;background:#fafafa;white-space:nowrap;text-overflow:ellipsis}.player-head{font-size:10px;font-weight:900;padding:3px 2px;background:#fafafa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-head.current{background:var(--accentSoft);color:var(--accent)}.score-cell{font-size:13px;font-weight:850;background:#fff}.score-cell.current-col{background:#fbfefe}.score-cell.suggestion{color:var(--accent);background:var(--accentSoft);cursor:pointer}.score-cell.suggestion.zero{color:#9a9a9f}.score-cell.selected{outline:2px solid var(--accent);outline-offset:-2px;background:#d4edef}.section-row .cat-col,.section-row td{height:23px;background:#ececf1;font-size:10.5px;font-weight:900;text-transform:uppercase;color:#555}.summary-row .cat-col,.summary-row td{height:28px;background:#f7f7f9;font-size:11.5px;font-weight:900}.grand-row .cat-col,.grand-row td{height:32px;background:#efeff4;font-size:13px;font-weight:950}
.control-dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--dock);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.dock-inner{width:min(744px,100%);margin:auto}.dice-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.die{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid transparent;border-radius:11px;box-shadow:0 1px 5px #0001;font-size:clamp(64px,18vw,96px);line-height:1;user-select:none;transform-origin:center;transition:transform .12s ease,border-color .12s ease,background .12s ease,opacity .12s ease}.die.held{border-color:var(--accent);background:var(--accentSoft);transform:translateY(-2px)}.die.disabled{opacity:.42}.die.rolling{animation:diceRoll .18s linear infinite;box-shadow:0 3px 10px #0002}@keyframes diceRoll{0%{transform:rotate(-10deg) scale(.94)}25%{transform:rotate(9deg) scale(1.04)}50%{transform:rotate(-6deg) scale(.98)}75%{transform:rotate(12deg) scale(1.03)}100%{transform:rotate(-10deg) scale(.94)}}.dock-actions{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 44px;gap:6px;margin-top:6px}.roll-btn,.confirm-btn,.menu-btn{min-height:43px;border-radius:11px;font-weight:900}.roll-btn{border:0;background:var(--accent);color:#fff;font-size:16px}.confirm-btn{border:0;background:var(--good);color:#fff;font-size:12.5px;padding:0 5px;line-height:1.05}.confirm-btn:disabled{background:#b9b9be}.menu-btn{border:1px solid var(--line);background:#fff;font-size:20px}.hint{text-align:center;color:var(--muted);font-size:10px;line-height:1.1;margin-top:3px;min-height:10px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.sheet button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:9px;font-weight:850}.secondary{background:#efeff4}.danger{background:#ffe8e6;color:var(--danger)}@media(max-width:360px){.cat-col{width:36%;font-size:11px}.player-head{font-size:9px}.score-cell{font-size:12px}.die{font-size:clamp(56px,17vw,88px)}}@media(prefers-reduced-motion:reduce){.die.rolling{animation:none}}
</style>
</head>
<body>
<section id="startScreen" class="screen active"><div class="start-wrap"><div class="start-card"><div class="logo">🎲</div><h1>Kniffel</h1><div class="subtitle">1 bis 4 Spieler</div><div class="label">Anzahl Spieler</div><div class="player-count"><button class="count-btn" data-count="1">1</button><button class="count-btn" data-count="2">2</button><button class="count-btn selected" data-count="3">3</button><button class="count-btn" data-count="4">4</button></div><div class="label">Spielernamen</div><div id="nameInputs" class="names"></div><button id="startGameBtn" class="primary">Spiel starten</button></div></div></section>
<section id="gameScreen" class="screen"><div class="game"><div class="game-head"><div><div class="turn-label">Am Zug</div><div id="turnName" class="turn-name"></div></div><div id="rollStatus" class="roll-status"></div></div><div class="score-wrap"><table id="scoreTable"></table></div></div></section>
<div class="control-dock" id="controlDock" style="display:none"><div class="dock-inner"><div id="diceRow" class="dice-row"></div><div class="dock-actions"><button id="rollBtn" class="roll-btn">Würfeln</button><button id="confirmBtn" class="confirm-btn" disabled>Eintragen &amp;<br>weiter</button><button id="menuBtn" class="menu-btn">⋯</button></div><div id="hint" class="hint"></div></div></div>
<div id="menuModal" class="modal"><div class="sheet"><h2>Spiel</h2><button id="closeMenuBtn" class="secondary">Weiter spielen</button><button id="newGameBtn" class="danger">Neues Spiel starten</button></div></div>
<script>
(()=>{const cats=[{id:'ones',label:'Einser',sec:'u'},{id:'twos',label:'Zweier',sec:'u'},{id:'threes',label:'Dreier',sec:'u'},{id:'fours',label:'Vierer',sec:'u'},{id:'fives',label:'Fünfer',sec:'u'},{id:'sixes',label:'Sechser',sec:'u'},{id:'threeKind',label:'Dreierpasch',sec:'l'},{id:'fourKind',label:'Viererpasch',sec:'l'},{id:'fullHouse',label:'Full House',sec:'l'},{id:'smallStraight',label:'Kl. Straße',sec:'l'},{id:'largeStraight',label:'Gr. Straße',sec:'l'},{id:'kniffel',label:'Kniffel',sec:'l'},{id:'chance',label:'Chance',sec:'l'}];let pc=3,players=[],scores=[],cur=0,dice=[1,1,1,1,1],held=[false,false,false,false,false],rolls=0,sel=null,selVal=null,isRolling=false,rollingMask=[false,false,false,false,false],audioCtx=null;
const $=id=>document.getElementById(id),start=$('startScreen'),game=$('gameScreen'),names=$('nameInputs'),turnName=$('turnName'),rollStatus=$('rollStatus'),diceRow=$('diceRow'),rollBtn=$('rollBtn'),hint=$('hint'),table=$('scoreTable'),confirmBtn=$('confirmBtn'),controlDock=$('controlDock'),modal=$('menuModal');
function audio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}function clickSound(){let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(650,t);o.frequency.exponentialRampToValueAtTime(300,t+.045);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.055)}function rollSound(){let a=audio();if(!a)return;let l=Math.floor(a.sampleRate*.035),b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*(1-i/l);let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=500+Math.random()*1000;g.gain.value=.065;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function renderNames(){names.innerHTML='';for(let i=0;i<pc;i++){let x=document.createElement('input');x.value=`Spieler ${i+1}`;x.maxLength=14;names.appendChild(x)}}document.querySelectorAll('.count-btn').forEach(b=>b.onclick=()=>{pc=+b.dataset.count;document.querySelectorAll('.count-btn').forEach(x=>x.classList.toggle('selected',x===b));renderNames()});renderNames();
$('startGameBtn').onclick=()=>{audio();players=[...names.querySelectorAll('input')].map((x,i)=>x.value.trim()||`Spieler ${i+1}`);scores=players.map(()=>Object.fromEntries(cats.map(c=>[c.id,null])));cur=0;resetTurn();start.classList.remove('active');game.classList.add('active');controlDock.style.display='block';renderAll()};
function cnt(){let c=[0,0,0,0,0,0,0];dice.forEach(v=>c[v]++);return c}function sum(){return dice.reduce((a,b)=>a+b,0)}function small(){let s=[...new Set(dice)].sort().join('');return s.includes('1234')||s.includes('2345')||s.includes('3456')}function large(){let s=[...new Set(dice)].sort().join('');return s==='12345'||s==='23456'}function val(id){let c=cnt(),s=sum();switch(id){case'ones':return c[1];case'twos':return c[2]*2;case'threes':return c[3]*3;case'fours':return c[4]*4;case'fives':return c[5]*5;case'sixes':return c[6]*6;case'threeKind':return c.some(n=>n>=3)?s:0;case'fourKind':return c.some(n=>n>=4)?s:0;case'fullHouse':return c.includes(3)&&c.includes(2)?25:0;case'smallStraight':return small()?30:0;case'largeStraight':return large()?40:0;case'kniffel':return c.includes(5)?50:0;case'chance':return s}}
function upper(i){return['ones','twos','threes','fours','fives','sixes'].reduce((a,id)=>a+(scores[i][id]??0),0)}function bonus(i){return upper(i)>=63?35:0}function lower(i){return['threeKind','fourKind','fullHouse','smallStraight','largeStraight','kniffel','chance'].reduce((a,id)=>a+(scores[i][id]??0),0)}function total(i){return upper(i)+bonus(i)+lower(i)}function fairDie(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=4294967292;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%6+1}return Math.floor(Math.random()*6)+1}
function renderDice(){diceRow.innerHTML='';dice.forEach((v,i)=>{let d=document.createElement('div');d.className='die'+(held[i]?' held':'')+(rolls===0&&!isRolling?' disabled':'')+(rollingMask[i]?' rolling':'');d.textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][v];d.onclick=()=>{if(isRolling||rolls===0||rolls>=3)return;held[i]=!held[i];clickSound();renderDice()};diceRow.appendChild(d)})}
function renderTop(){turnName.textContent=players[cur];rollStatus.textContent=`Wurf ${rolls} / 3`;if(isRolling){hint.textContent='Würfel rollen …';rollBtn.textContent='Würfelt …'}else if(rolls===0){hint.textContent='Würfeln drücken.';rollBtn.textContent='Würfeln'}else if(rolls<3){hint.textContent='Würfel antippen = behalten.';rollBtn.textContent=`Würfeln (${3-rolls} übrig)`}else{hint.textContent='Kategorie wählen und eintragen.';rollBtn.textContent='Keine Würfe mehr'}rollBtn.disabled=isRolling||rolls>=3;rollBtn.style.opacity=rollBtn.disabled?'.5':'1';confirmBtn.disabled=isRolling||sel===null||rolls===0}
function row(c){let r=`<tr><th class="cat-col">${c.label}</th>`;players.forEach((_,i)=>{let old=scores[i][c.id],curCol=i===cur;if(old!==null)r+=`<td class="score-cell">${old}</td>`;else if(curCol&&rolls>0){let v=val(c.id);r+=`<td class="score-cell suggestion ${v===0?'zero':''} ${sel===c.id?'selected':''}" data-cat="${c.id}" data-val="${v}">${v}</td>`}else r+=`<td class="score-cell ${curCol?'current-col':''}">–</td>`});return r+'</tr>'}function summary(l,f,g=false){let r=`<tr class="${g?'grand-row':'summary-row'}"><th class="cat-col">${l}</th>`;players.forEach((_,i)=>r+=`<td>${f(i)}</td>`);return r+'</tr>'}
function renderTable(){let h='<thead><tr><th class="cat-col">Kategorie</th>';players.forEach((p,i)=>h+=`<th class="player-head ${i===cur?'current':''}">${esc(p)}</th>`);h+='</tr></thead><tbody><tr class="section-row"><th class="cat-col">Oberer Block</th>'+players.map(()=>'<td></td>').join('')+'</tr>';cats.filter(c=>c.sec==='u').forEach(c=>h+=row(c));h+=summary('Zwischensumme',upper)+summary('Bonus ab 63',bonus)+'<tr class="section-row"><th class="cat-col">Unterer Block</th>'+players.map(()=>'<td></td>').join('')+'</tr>';cats.filter(c=>c.sec==='l').forEach(c=>h+=row(c));h+=summary('Gesamt',total,true)+'</tbody>';table.innerHTML=h;table.querySelectorAll('.suggestion').forEach(td=>td.onclick=()=>{if(isRolling)return;sel=td.dataset.cat;selVal=+td.dataset.val;clickSound();renderTable();renderTop()})}
function renderAll(){renderDice();renderTop();renderTable()}function finishRoll(finalDice){dice=finalDice;rolls++;sel=null;selVal=null;isRolling=false;rollingMask=[false,false,false,false,false];renderAll()}rollBtn.onclick=()=>{if(isRolling||rolls>=3)return;audio();isRolling=true;sel=null;selVal=null;rollingMask=held.map(h=>!h);const finalDice=dice.map((v,i)=>held[i]?v:fairDie());renderTop();renderDice();renderTable();rollSound();const t=performance.now(),ticker=setInterval(()=>{dice=dice.map((v,i)=>rollingMask[i]?fairDie():v);rollSound();renderDice();if(performance.now()-t>=620){clearInterval(ticker);finishRoll(finalDice);clickSound()}},90)};
confirmBtn.onclick=()=>{if(isRolling||sel===null||rolls===0)return;clickSound();scores[cur][sel]=selVal;if(scores.every(p=>cats.every(c=>p[c.id]!==null))){renderAll();setTimeout(()=>alert(players.map((p,i)=>`${p}: ${total(i)} Punkte`).join('\n')),100);return}cur=(cur+1)%players.length;resetTurn();renderAll();document.querySelector('.score-wrap').scrollTo({top:0,behavior:'smooth'})};function resetTurn(){dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=0;sel=null;selVal=null;isRolling=false;rollingMask=[false,false,false,false,false]}$('menuBtn').onclick=()=>modal.classList.add('open');$('closeMenuBtn').onclick=()=>modal.classList.remove('open');$('newGameBtn').onclick=()=>{if(confirm('Aktuelles Spiel beenden?')){modal.classList.remove('open');game.classList.remove('active');start.classList.add('active');controlDock.style.display='none';renderNames()}};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
})();
</script>
</body>
</html>
